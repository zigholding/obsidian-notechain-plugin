name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes_file="$(mktemp)"
          git tag -l --format='%(contents)' "$tag" | tr -d '\r' > "$notes_file"
          first="$(sed -n '1p' "$notes_file")"
          rest="$(tail -n +2 "$notes_file" | sed '/^$/d')"

          if [ ! -s "$notes_file" ] || { [ "$first" = "$tag" ] && [ -z "$rest" ]; }; then
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              --draft \
              main.js manifest.json styles.css
          else
            gh release create "$tag" \
              --title="$tag" \
              --notes-file "$notes_file" \
              --draft \
              main.js manifest.json styles.css
          fi
